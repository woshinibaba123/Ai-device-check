name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python desktop/build.py
      - name: Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop/DeviceCheck.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mac disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p .runtime/dmg dist/installers
          ditto "dist/desktop/巡测.app" ".runtime/dmg/巡测.app"
          ln -s /Applications .runtime/dmg/Applications
          cp desktop/安装说明.txt desktop/配置已安装应用环境.command .runtime/dmg/
          hdiutil create -volname "巡测" -srcfolder .runtime/dmg -ov -format UDZO dist/installers/DeviceCheck-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceCheck-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/*
